name: Nightly Evolution Run

on:
  schedule:
    # 02:00 UTC nightly — adjust to taste
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      generations:
        description: 'Generations override'
        required: false
        default: '10'
      population:
        description: 'Population override'
        required: false
        default: '20'

jobs:
  run-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache cleaned dataset
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data/clean/xauusd_m1.parquet
          key: xauusd-parquet-data-v1

      - name: Download cleaned dataset (cache miss)
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/clean
          curl -L -o data/clean/xauusd_m1.parquet \
            https://github.com/mmr055/learningbacktesting/releases/download/data-v1/xauusd_m1.parquet

      - name: Derive seed from date
        id: seed
        run: echo "seed=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        run: |
          python -m src.pipeline \
            --generations "${{ github.event.inputs.generations || '10' }}" \
            --population "${{ github.event.inputs.population || '20' }}" \
            --insample-days 180 \
            --seed "${{ steps.seed.outputs.seed }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "Nightly run: seed ${{ steps.seed.outputs.seed }}"
          git push
