name: evolve-and-validate

on:
  schedule:
    - cron: "0 3 * * *"   # nightly at 03:00 UTC — adjust to taste
  workflow_dispatch: {}     # allows manual trigger from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # GitHub free tier: 2000 min/month on public repos,
                            # much less on private — tune generations/population
                            # to fit your remaining minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evolution + validation pipeline
        run: python -m src.pipeline --generations 40 --population 60

      - name: Commit results back to repo
        run: |
          git config user.name "evo-bot"
          git config user.email "evo-bot@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Automated run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
